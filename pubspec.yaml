name: velocambio
description: "App para cambio de monedas"
publish_to: 'none'
version: 1.1.1+012

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.0
  provider: ^6.1.5+1
  google_fonts: ^6.3.2
  skeletonizer: ^2.1.1
  intl: ^0.20.2
  hive:
  hive_flutter:
  google_mobile_ads: ^9.0.0
  package_info_plus: ^10.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.1.1
  toastification: ^3.2.0
  pretty_dio_logger: ^1.4.0
  home_widget: ^0.9.3
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator:
  build_runner:
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/env/.env.dev
    - assets/env/.env.prod

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon" # O true si quieres el nombre por defecto
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A202C"
  adaptive_icon_foreground: "assets/images/app_icon.png"
